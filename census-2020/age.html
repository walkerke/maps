: Census DHC, table P12, both sexes combined. Ages are assigned within each block from its published counts.<\/p><p>The Census adds statistical noise through <a href='https://www.census.gov/library/publications/2024/dec/c2020br-08.html' target='_blank' rel='noopener noreferrer'>differential privacy<\/a> to protect people's identities. In sparsely populated areas, this can produce unexpected age or race counts, including zeros. Don't interpret a zero as proof that no one in that group lives there. Small hexagons also reflect random dot placement.<\/p><\/details>","position":"bottom-right"}},"navigation_control":{"show_compass":true,"show_zoom":true,"visualize_pitch":false,"position":"top-right","orientation":"vertical"},"scale_control":{"position":"bottom-left","unit":"metric","maxWidth":100}},"evals":[],"jsHooks":{"render":[{"code":"function(el, x, config) {\n  const map = this.getMap();\n  el.classList.add('demographic-map');\n  // MapLibre 5.24's globe constraint converts the zoom floor by latitude.\n  // Keep the actual style zoom at the archive floor too, so z3 layers cannot\n  // disappear when zooming out or panning north. This is its public camera\n  // constraint callback; no projection internals or move-event recursion.\n  map.transformCameraUpdate = next => ({zoom: Math.max(map.getMinZoom(), next.zoom)});\n  function initialize() {\n    if (!map.getLayer('people') || !map.getLayer('composition-clusters') ||\n        !Object.values(config.legendIds).every(id => document.getElementById(id))) {\n      map.once('idle', initialize);\n      return;\n    }\n    const buttons = [...el.querySelectorAll('[data-map-mode]')];\n    const status = el.querySelector('[data-mode-description]');\n    const hexes = config.hexLayers;\n    const clusters = ['composition', 'composition-clusters', 'composition-cluster-count'];\n    let mode = 'hex';\n    const display = (ids, visible) => ids.forEach(id => {\n      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');\n    });\n    function legends() {\n      const z = map.getZoom();\n      const dots = mode === 'dots' || (mode === 'hex' ? z >= config.legendSwitch : z >= 12);\n      const active = dots ? 'dots' : mode;\n      ['dots', 'hex', 'clusters'].forEach(key => {\n        const legend = document.getElementById(config.legendIds[key]);\n        if (legend) legend.classList.toggle('demographic-hidden', key !== active);\n      });\n      status.textContent = active === 'dots' ? (z >= 13 ? 'One dot per person' : 'Zoom in to see every dot') :\n        active === 'hex' ? 'Largest group · 10+ people per hex' : 'Click a donut to zoom in';\n      el.dataset.mapMode = mode;\n      el.dataset.visibleRepresentation = active;\n    }\n    function select(next) {\n      mode = next;\n      display(hexes, mode === 'hex');\n      display(clusters, mode === 'clusters');\n      display(['people'], true);\n      map.setLayerZoomRange('people', mode === 'dots' ? 3 : 12, 24);\n      map.setPaintProperty('people', 'circle-opacity', mode === 'hex' ? config.dotFade : 0.8);\n      buttons.forEach(button => {\n        const active = button.dataset.mapMode === mode;\n        button.setAttribute('aria-checked', String(active));\n        button.tabIndex = active ? 0 : -1;\n      });\n      legends();\n      // mapgl may update legend layout on a style event; our CSS visibility\n      // class remains authoritative without touching category filter state.\n      requestAnimationFrame(legends);\n    }\n    buttons.forEach((button, index) => {\n      button.addEventListener('click', () => select(button.dataset.mapMode));\n      button.addEventListener('keydown', event => {\n        if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;\n        event.preventDefault();\n        const next = event.key === 'Home' ? 0 : event.key === 'End' ? buttons.length - 1 :\n          (index + (event.key === 'ArrowRight' ? 1 : -1) + buttons.length) % buttons.length;\n        select(buttons[next].dataset.mapMode); buttons[next].focus();\n      });\n    });\n    // Consume the precomputed expansion field. Existing mapgl supplies all\n    // rendering, counts, donut images and cursor handling; only its current\n    // vector-tile '+1' click fallback is replaced for these new archives.\n    const layer = 'composition-clusters';\n    const prior = map._mapglClusterHandlers?.[layer];\n    if (prior) map.off('click', layer, prior.click);\n    const click = event => {\n      const feature = map.queryRenderedFeatures(event.point, {layers: [layer]})[0];\n      if (!feature) return;\n      const expansion = Number(feature.properties.cluster_expansion_zoom);\n      const zoom = Number.isFinite(expansion) ? expansion : Math.floor(map.getZoom()) + 1;\n      map.easeTo({center: feature.geometry.coordinates, zoom: Math.min(zoom, map.getMaxZoom())});\n    };\n    map.on('click', layer, click);\n    if (prior) prior.click = click;\n    map.on('zoom', legends);\n    select('hex');\n    // Reparent native controls, never clone their HTML or filtering logic.\n    // Desktop positions and collapse states are restored on a width change.\n    const media = window.matchMedia('(max-width: 640px), (max-height: 500px) and (pointer: coarse)');\n    const sheet = document.createElement('section');\n    sheet.className = 'demographic-mobile-panel';\n    sheet.setAttribute('aria-label', 'Map information');\n    const panes = {}, triggers = {};\n    const footer = document.createElement('div');\n    footer.className = 'demographic-mobile-buttons';\n    for (const [key, label] of [['legend','Legend'], ['about','About this map']]) {\n      const pane = document.createElement('div');\n      pane.className = 'demographic-mobile-content';\n      pane.id = el.id + '-mobile-' + key;\n      pane.hidden = true;\n      pane.setAttribute('role', 'region');\n      const trigger = document.createElement('button');\n      trigger.type = 'button';\n      trigger.textContent = label;\n e('mapgl-legend-collapsed');\n          (node === about ? panes.about : panes.legend).append(node);\n        }\n        about.open = true;\n      } else if (!media.matches && desktopState) {\n        const restoreFocus = sheet.contains(document.activeElement);\n        homes.forEach(({node,marker},i) => {\n          marker.after(node); node.classList.toggle('mapgl-legend-collapsed',desktopState.collapsed[i]);\n        });\n        about.open = desktopState.aboutOpen;\n        desktopState = null; openPanel(null);\n        if (restoreFocus) buttons.find(button=>button.getAttribute('aria-checked')==='true').focus();\n      }\n      measure();\n      requestAnimationFrame(()=>map.resize());\n    }\n    media.addEventListener('change', responsive);\n    const observer = new ResizeObserver(measure);\n    observer.observe(sheet);\n    const resize = () => map.resize();\n    window.visualViewport?.addEventListener('resize',resize);\n    responsive();\n    map.once('remove',()=>{\n      observer.disconnect(); media.removeEventListener('change',responsive);\n      window.visualViewport?.removeEventListener('resize',resize);\n    });\n    map._demographicView = {select, get mode() { return mode; }};\n  }\n  if (map.isStyleLoaded()) initialize(); else map.once('load', initialize);\n}","data":{"hexLayers":["h3_r04","h3_r04_ties","h3_r05","h3_r05_ties","h3_r06","h3_r06_ties","h3_r07","h3_r07_ties","h3_r08","h3_r08_ties"],"legendIds":{"dots":"age-dot-legend","hex":"age-hex-legend","clusters":"age-cluster-legend"},"legendSwitch":12.375,"dotFade":["interpolate",["linear"],["zoom"],12,0,12.75,0.8]}}]}}</script>
